<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Results</title>
    
    <!-- Load Chart.js library for creating charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* Basic styling for the page */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f5;
            margin: 0;
            padding: 0;
        }

        /* Header styling */
        header {
            background-color: #4CAF50;
            padding: 20px;
            text-align: center;
            color: white;
        }

        /* Main container styling */
        .container {
            max-width: 600px;
            margin: 30px auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        /* Title styling */
        h2 {
            text-align: center;
            color: #333;
        }

        /* Styling for the results section */
        .results {
            margin-bottom: 30px;
            text-align: center;
        }

        /* Center canvas (chart) */
        canvas {
            display: block;
            margin: auto;
        }

        /* Footer styling */
        footer {
            text-align: center;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            position: relative;
            bottom: 0;
            width: 100%;
        }

        /* Button styling */
        .btn {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        /* Button hover effect */
        .btn:hover {
            background-color: #45a049;
        }
    </style>

    <script>
        // Runs the code after the page loads
        window.onload = function() {
            // Retrieve voting data from localStorage
            const votingData = JSON.parse(localStorage.getItem('votingData')) || {
                candidates: {
                    candidate1: 0,
                    candidate2: 0,
                    candidate3: 0,
                    candidate4: 0,
                },
                voters: 0
            };

            // Display total voter count
            document.getElementById('votersCount').innerText = `Total voters: ${votingData.voters}`;

            // Display votes for each candidate
            document.getElementById('votesCandidate1').innerText = `Candidate 1: ${votingData.candidates.candidate1} votes`;
            document.getElementById('votesCandidate2').innerText = `Candidate 2: ${votingData.candidates.candidate2} votes`;
            document.getElementById('votesCandidate3').innerText =` Candidate 3: ${votingData.candidates.candidate3} votes`;
            document.getElementById('votesCandidate4').innerText = `Candidate 4: ${votingData.candidates.candidate4} votes`;

            // Create a bar chart to show vote distribution using Chart.js
            const ctx = document.getElementById('voteChart').getContext('2d');
            const chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Candidate 1', 'Candidate 2', 'Candidate 3', 'Candidate 4'],
                    datasets: [{
                        label: 'Votes',
                        data: [
                            votingData.candidates.candidate1,
                            votingData.candidates.candidate2,
                            votingData.candidates.candidate3,
                            votingData.candidates.candidate4,
                        ],
                        backgroundColor: [
                            'rgba(75, 192, 192, 0.2)',
                            'rgba(153, 102, 255, 0.2)',
                            'rgba(255, 159, 64, 0.2)',
                            'rgba(255, 99, 132, 0.2)',
                        ],
                        borderColor: [
                            'rgba(75, 192, 192, 1)',
                            'rgba(153, 102, 255, 1)',
                            'rgba(255, 159, 64, 1)',
                            'rgba(255, 99, 132, 1)',
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        };

        // Logout function that notifies the user and redirects
        function logout() {
            alert("You have been logged out.");
            window.location.href = "login.html";
        }
    </script>
</head>
<body>

    <!-- Header section with title -->
    <header>
        <h1>Voting Results</h1>
    </header>

    <!-- Main container for displaying results -->
    <div class="container">
        <h2>Results</h2>
        <div class="results">
            <!-- Total voters and votes for each candidate -->
            <div id="votersCount"></div>
            <div id="votesCandidate1"></div>
            <div id="votesCandidate2"></div>
            <div id="votesCandidate3"></div>
            <div id="votesCandidate4"></div>
        </div>
        <!-- Canvas element to display the bar chart -->
        <canvas id="voteChart" width="400" height="200"></canvas>
    </div>

    <!-- Navigation buttons for returning to the home page or logging out -->
    <div class="container" style="text-align: center;">
        <a href="home.html" class="btn">Return to Home</a>
        <a href="login.html" class="btn" onclick="logout()">Logout</a>
    </div>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2024 E-Voting Application</p>
    </footer>

</body>
</html>
