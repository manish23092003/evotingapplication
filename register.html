<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f5;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #4CAF50;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .logo {
            width: 100px;
            height: auto;
        }

        .container {
            width: 50%;
            margin: auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
            flex: 1;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"],
        input[type="password"],
        input[type="tel"],
        select {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        input[type="submit"],
        button {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        input[type="submit"]:hover,
        button:hover {
            background-color: #45a049;
        }

        .photo-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .photo-section img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 2px solid #ddd;
            border-radius: 50%;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
        }

        /* Updated CAPTCHA section */
        .captcha-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .captcha-label {
            display: inline-block;
            font-size: 16px;
            font-weight: bold;
        }

        .captcha {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 3px;
            padding: 10px;
            background-color: #ffeb3b;
            color: #333;
            border-radius: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            display: inline-block;
            margin-bottom: 10px;
            box-shadow: 2px 2px 6px rgba(0, 0, 0, 0.1);
        }

        .captcha-input {
            padding: 10px;
            font-size: 16px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .captcha-refresh {
            margin-top: 5px;
            font-size: 14px;
            color: black;
            cursor: pointer;
            text-align: right;
        }

        .captcha-refresh:hover {
            text-decoration: underline;
        }

        /* Video element styling */
        #video {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            background-color: #ddd;
            object-fit: cover;
        }
    </style>
    <script>
        // Function to generate a random CAPTCHA code
        function generateCaptcha() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            document.getElementById('captchaCode').textContent = captcha;
            return captcha;
        }

        // Function to verify CAPTCHA code
        function verifyCaptcha() {
            const enteredCaptcha = document.getElementById('captchaInput').value;
            const generatedCaptcha = document.getElementById('captchaCode').textContent;

            if (enteredCaptcha !== generatedCaptcha) {
                alert('Incorrect CAPTCHA. Please try again.');
                return false;
            }
            return true;
        }

        // Function to handle registration and redirect to login page
        function handleRegistration(event) {
            event.preventDefault();

            // Get user data from the form
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const mobile = document.getElementById('mobile').value;
            const voterId = document.getElementById('voterId').value;

            // Verify OTP and CAPTCHA before proceeding
            if (!verifyOTP() || !verifyCaptcha()) return;

            // Fetch existing users from local storage or initialize an empty array
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];

            // Save the new user details
            registeredUsers.push({ username, password, mobile, voterId });
            localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));

            // Show success message and redirect to login page
            alert('Registration successful! Redirecting to login page...');
            window.location.href = 'login.html';
        }

        // Initialize CAPTCHA on page load
        window.onload = function () {
            generateCaptcha();
        }

        // Function to refresh CAPTCHA
        function refreshCaptcha() {
            generateCaptcha();
        }

       
    </script>
</head>

<body>
    <header>
        <a href="home.html">
            <img src="unnamed.png" alt="Logo" class="logo">
        </a>
        <h1>E-Voting System - Register</h1>
    </header>

    <div class="container">
        <h2>Register</h2>
        <form id="registerForm" onsubmit="handleRegistration(event)">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>

            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>

            <label for="voterId">Voter ID:</label>
            <input type="text" id="voterId" name="voterId" placeholder="Enter your voter ID" required>

            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="" disabled selected>Select your gender</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <div class="captcha-section">
                <div>
                    <span class="captcha-label">Enter CAPTCHA Code:</span>
                    <span class="captcha" id="captchaCode"></span>
                </div>
                <input type="text" id="captchaInput" class="captcha-input" placeholder="Enter CAPTCHA code" required>
                <span class="captcha-refresh" onclick="refreshCaptcha()">Refresh CAPTCHA</span>
            </div>

            <input type="submit" value="Register">
        </form>
    </div>
    

    <footer>
        <p>&copy; 2024 E-Voting Application</p>
    </footer>

    <script>
        // Function to generate a random CAPTCHA code
        function generateCaptcha() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let captcha = '';
            for (let i = 0; i < 6; i++) {
                captcha += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            document.getElementById('captchaCode').textContent = captcha;
            return captcha;
        }

        // Function to verify CAPTCHA code
        function verifyCaptcha() {
            const enteredCaptcha = document.getElementById('captchaInput').value;
            const generatedCaptcha = document.getElementById('captchaCode').textContent;

            if (enteredCaptcha !== generatedCaptcha) {
                alert('Incorrect CAPTCHA. Please try again.');
                return false;
            }
            return true;
        }

        // Dummy OTP verification function
        function verifyOTP() {
            // For demo purposes, we'll just return true.
            // You could add a prompt here: prompt("Enter OTP sent to your mobile (1234):") === "1234"
            return true;
        }

        // Function to handle registration and redirect to login page
        function handleRegistration(event) {
            event.preventDefault();

            // Get user data from the form
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const mobile = document.getElementById('mobile').value;
            const voterId = document.getElementById('voterId').value;
            const gender = document.getElementById('gender').value;

            // Verify OTP and CAPTCHA before proceeding
            if (!verifyOTP() || !verifyCaptcha()) return;

            // Fetch existing users from local storage or initialize an empty array
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers')) || [];

            // Check if user already exists
            if (registeredUsers.some(user => user.username === username)) {
                alert('Username already exists. Please choose another.');
                return;
            }

            // Save the new user details
            registeredUsers.push({ username, password, mobile, voterId, gender });
            localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));

            // Show success message and redirect to login page
            alert('Registration successful! Redirecting to login page...');
            window.location.href = 'login.html';
        }

        // Initialize CAPTCHA on page load
        window.onload = function () {
            generateCaptcha();
        }

        // Function to refresh CAPTCHA
        function refreshCaptcha() {
            generateCaptcha();
        }
    </script>
</body>

</html>
