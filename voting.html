<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Page</title>
    <link rel="stylesheet" href="style.css"> <!-- Fixed link tag -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f5;
            padding: 0;
            margin: 0;
        }

        header {
            background-color: #4CAF50;
            padding: 20px;
            text-align: center;
            color: white;
        }

        .container {
            width: 50%;
            margin: auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="radio"] {
            margin-right: 10px;
        }

        input[type="submit"],
        button {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        input[type="submit"]:hover,
        button:hover {
            background-color: #45a049;
        }

        .photo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .photo-section img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ddd;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            position: absolute;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>

<body>
    <header>
        <h1>E-Voting System - Vote for Your Candidate</h1>
    </header>

    <div class="container">
        <h2>Vote for Your Candidate</h2>
        <form id="votingForm" onsubmit="comparePhotos(event)">
            <label><input type="radio" name="candidate" value="candidate1" required> Candidate 1</label>
            <label><input type="radio" name="candidate" value="candidate2"> Candidate 2</label>
            <label><input type="radio" name="candidate" value="candidate3"> Candidate 3</label>
            <label><input type="radio" name="candidate" value="candidate4"> Candidate 4</label>

            <input type="submit" value="Submit Vote" >
        </form>
    </div>

    <footer>
        <p>&copy; 2024 E-Voting Application</p>
    </footer>

    <script>
        function comparePhotos(event) {
            event.preventDefault();

            // Get selected candidate
            const selectedCandidate = document.querySelector('input[name="candidate"]:checked').value;

            // Retrieve current voting data from localStorage
            let votingData = JSON.parse(localStorage.getItem('votingData')) || {
                candidates: {
                    candidate1: 0,
                    candidate2: 0,
                    candidate3: 0,
                    candidate4: 0,
                },
                voters: 0
            };

            // Update candidate vote count and total voter count
            votingData.candidates[selectedCandidate]++;
            votingData.voters++;

            // Save updated voting data back to localStorage
            localStorage.setItem('votingData', JSON.stringify(votingData));

            // Redirect to the thank-you page
            alert("Your vote has been successfully cast!");
            window.location.href = "thank-you.html";
        }
    </script>
</body>
</html>
