<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch to Reveal</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
        }
        .container {
            position: relative;
            width: 400px;
            height: 300px;
            margin-bottom: 20px;
        }
        img {
            width: 100%;
            height: 100%;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
        }
        .nav-buttons {
            display: flex;
            gap: 20px;
            z-index: 100;
        }
        .btn {
            padding: 12px 24px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-results {
            background-color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="WhatsApp Image 2024-11-06 at 00.34.06_5a12844c.jpg" alt="voucher" id="voucherImage">
        <canvas id="scratchCanvas"></canvas>
    </div>

    <!-- Navigation buttons -->
    <div class="nav-buttons">
        <a href="home.html" class="btn">Back to Home</a>
        <a href="results.html" class="btn btn-results">View Results</a>
    </div>

    <script>
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const img = document.getElementById('voucherImage');

        function initCanvas() {
            canvas.width = img.clientWidth || 400;
            canvas.height = img.clientHeight || 300;
            
            // Fill with overlay
            ctx.fillStyle = '#ff69b4'; // Pink overlay
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add hint text
            ctx.fillStyle = 'white';
            ctx.font = '24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Scratch to Reveal!', canvas.width / 2, canvas.height / 2);
        }

        // Initialize when image is loaded
        if (img.complete) {
            initCanvas();
        } else {
            img.onload = initCanvas;
        }

        let isDrawing = false;

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (e.clientX || e.touches[0].clientX) - rect.left,
                y: (e.clientY || e.touches[0].clientY) - rect.top
            };
        }

        function scratch(e) {
            if (!isDrawing) return;
            e.preventDefault();
            const pos = getMousePos(e);

            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 25, 0, Math.PI * 2);
            ctx.fill();
        }

        // Mouse events
        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => isDrawing = false);
        canvas.addEventListener('mousemove', scratch);

        // Touch events for mobile
        canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
        canvas.addEventListener('touchend', () => isDrawing = false);
        canvas.addEventListener('touchmove', scratch);
    </script>
</body>
</html>
